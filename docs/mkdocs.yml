site_name: Crosswalk
site_description: Convert scholarly metadata through a validated hub
repo_url: https://github.com/lehigh-university-libraries/crosswalk
site_url: !ENV [ SITE_URL, "https://lehigh-university-libraries.github.io/crosswalk/" ]
docs_dir: content
site_dir: site
edit_uri: edit/main/docs/content/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - search.highlight
  palette:
    primary: indigo
    accent: blue

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: lehigh-university-libraries
      repo: crosswalk
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ""
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - css/custom.css

extra_javascript:
  - js/mermaid-init.mjs

nav:
  - Start here:
      - What Crosswalk does: index.md
      - Install and try a conversion: getting-started.md
      - Check supported source and target formats: formats.md
  - Configure site-specific mappings:
      - Map Drupal or Omeka S fields: profiles.md
      - Map spreadsheet and Workbench fields: specifications.md
  - Acquire and prepare records:
      - Fetch metadata and media safely: acquisition.md
      - Check for existing repository items: reconciliation.md
      - Create Islandora Workbench files: workbench.md
  - Operate Crosswalk:
      - Run the authenticated HTTP service: http-service.md
      - Review limits and rollout checks: limitations.md
  - How Crosswalk works:
      - Follow the conversion pipeline: architecture.md
      - Understand Hub records and datasets: hub-dataset.md
  - Develop and contribute: contributing.md
