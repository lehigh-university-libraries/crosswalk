site_name: Crosswalk
site_description: Convert scholarly metadata through a validated hub
repo_url: https://github.com/lehigh-university-libraries/crosswalk
site_url: !ENV [ SITE_URL, "https://lehigh-university-libraries.github.io/crosswalk/" ]
docs_dir: .
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - search.highlight
  palette:
    primary: indigo
    accent: blue

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: lehigh-university-libraries
      repo: crosswalk
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ""
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - css/custom.css

extra_javascript:
  - js/mermaid-init.mjs

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Profiles and models: profiles.md
  - Existing-item reconciliation: reconciliation.md
  - Islandora Workbench: workbench.md
  - HTTP service: http-service.md
  - Format support: formats.md
  - Contributing: contributing.md
